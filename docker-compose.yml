services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # An Atlas URI in .env wins; an empty or missing value falls back to the local mongo service.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      # Compose fixes the container port so the 8000:8000 mapping always matches.
      PORT: "8000"
      # Local and smoke use only: `AI_CLIENT=fake docker compose up` runs without an API key.
      AI_CLIENT: ${AI_CLIENT:-litellm}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    ports:
      # Published so the backend dev server on the host can use mongodb://localhost:27017.
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mongo-data:
