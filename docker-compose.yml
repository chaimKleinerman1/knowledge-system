services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # The app talks to MongoDB Atlas; the URI comes from .env (or the shell).
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env to your MongoDB connection string}
      # Overridable from the shell, for example to try things in a throwaway database.
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-knowledge}
      # Compose fixes the container port so the 8000:8000 mapping always matches.
      PORT: "8000"
